<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1160 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lifecycle-title lifecycle-desc" id="lifecycle-root">
      <title id="lifecycle-title">Team lifecycle</title>
      <desc id="lifecycle-desc">State machine of a fleet team: Working, Waiting on a named thing, Idle and Stalled as faults, Ready for merge, Parked by a person, and Retired.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #lifecycle-root { font-family: 'Geist', system-ui, sans-serif; color: #2d3142; }
      #lifecycle-root .scroll { overflow-x: auto; }</style>
        <marker id="lifecycle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="lifecycle-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <line x1="274" y1="144" x2="320" y2="144" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lifecycle-arrow)"/>
      <line x1="480" y1="148" x2="640" y2="148" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lifecycle-arrow)"/>
      <line x1="640" y1="176" x2="480" y2="176" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lifecycle-arrow)"/>
      <line x1="800" y1="160" x2="920" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lifecycle-arrow)"/>
      <line x1="1080" y1="160" x2="1110" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lifecycle-arrow)"/>
      <path d="M 320 180 H 168 A 8 8 0 0 0 160 188 V 300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lifecycle-arrow)"/>
      <path d="M 200 300 V 248 A 8 8 0 0 1 208 240 H 336 A 8 8 0 0 0 344 232 V 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lifecycle-arrow)"/>
      <line x1="380" y1="200" x2="380" y2="300" stroke="#bf4520" stroke-width="1.2" marker-end="url(#lifecycle-arrow-accent)"/>
      <line x1="420" y1="300" x2="420" y2="200" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lifecycle-arrow)"/>
      <line x1="480" y1="340" x2="600" y2="340" stroke="#bf4520" stroke-width="1.2" marker-end="url(#lifecycle-arrow-accent)"/>
      <path d="M 680 300 V 268 A 8 8 0 0 0 672 260 H 464 A 8 8 0 0 1 456 252 V 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lifecycle-arrow)"/>
      <rect x="281" y="126" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="297" y="135" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">BOOT</text>
      <rect x="528" y="130" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="139" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SIGNED OFF</text>
      <rect x="533.5" y="182" width="53" height="12" rx="2" fill="#f5f5f5"/>
      <text x="560" y="191" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CONFLICT</text>
      <rect x="839" y="142" width="42" height="12" rx="2" fill="#f5f5f5"/>
      <text x="860" y="151" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MERGED</text>
      <rect x="88" y="256" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="147" y="265" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.06em">WAIT NAMED</text>
      <rect x="240" y="222" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="272" y="231" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">IT CHANGED</text>
      <rect x="324" y="268" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="367" y="277" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.06em">NO WAIT</text>
      <rect x="428" y="276" width="37" height="12" rx="2" fill="#f5f5f5"/>
      <text x="433" y="285" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">NUDGE</text>
      <rect x="500" y="322" width="80" height="12" rx="2" fill="#f5f5f5"/>
      <text x="540" y="331" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">2ND IDLE TICK</text>
      <rect x="538.5" y="242" width="59" height="12" rx="2" fill="#f5f5f5"/>
      <text x="568" y="251" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RECOVERED</text>
      <circle cx="268" cy="144" r="6" fill="#2d3142"/>
      <rect x="320" y="120" width="160" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="320" y="120" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="328" y="128" width="35" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.5" stroke-width="0.8"/>
      <text x="345.5" y="137" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="400" y="168" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Working</text>
      <text x="400" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">an agent is mid-turn</text>
      <rect x="640" y="120" width="160" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="640" y="120" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="648" y="128" width="35" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.5" stroke-width="0.8"/>
      <text x="665.5" y="137" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="720" y="168" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Ready</text>
      <text x="720" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">owner merges</text>
      <rect x="920" y="120" width="160" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="920" y="120" width="160" height="80" rx="8" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
      <rect x="928" y="128" width="35" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.5" stroke-width="0.8"/>
      <text x="945.5" y="137" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="1000" y="168" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Retired</text>
      <text x="1000" y="184" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">closed</text>
      <rect x="80" y="300" width="160" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="80" y="300" width="160" height="80" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="88" y="308" width="35" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.5" stroke-width="0.8"/>
      <text x="105.5" y="317" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="160" y="348" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Waiting</text>
      <text x="160" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">loop watches the thing</text>
      <rect x="320" y="300" width="160" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="320" y="300" width="160" height="80" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
      <rect x="328" y="308" width="35" height="12" rx="2" fill="none" stroke="#bf4520" stroke-opacity="0.5" stroke-width="0.8"/>
      <text x="345.5" y="317" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="400" y="348" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Idle</text>
      <text x="400" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">loop nudges, every tick</text>
      <rect x="600" y="300" width="160" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="600" y="300" width="160" height="80" rx="8" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
      <rect x="608" y="308" width="35" height="12" rx="2" fill="none" stroke="#bf4520" stroke-opacity="0.5" stroke-width="0.8"/>
      <text x="625.5" y="317" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="680" y="348" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Stalled</text>
      <text x="680" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Orchestrator is woken</text>
      <rect x="920" y="300" width="160" height="80" rx="8" fill="#f5f5f5"/>
      <rect x="920" y="300" width="160" height="80" rx="8" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
      <rect x="928" y="308" width="35" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.5" stroke-width="0.8"/>
      <text x="945.5" y="317" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">STATE</text>
      <text x="1000" y="348" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Parked</text>
      <text x="1000" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">owner or Orchestrator only</text>
      <circle cx="1120" cy="160" r="8" fill="none" stroke="#2d3142" stroke-width="1"/>
      <circle cx="1120" cy="160" r="5" fill="#2d3142"/>
      <text x="876" y="256" fill="#2d3142" font-size="15" font-style="italic" font-family="'Instrument Serif', serif">Entered from any state, by a person.</text>
      <text x="876" y="276" fill="#2d3142" font-size="15" font-style="italic" font-family="'Instrument Serif', serif">The loop never parks or unparks.</text>
      <line x1="32" y1="428" x2="1128" y2="428" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
      <text x="32" y="448" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="112" y="439" width="20" height="12" rx="3" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
      <text x="140" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">fault: someone is told this tick</text>
      <line x1="351" y1="445" x2="371" y2="445" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="379" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">the loop brings the team back</text>
      <rect x="573" y="439" width="20" height="12" rx="3" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
      <text x="601" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">at rest by choice</text>
    </svg>
