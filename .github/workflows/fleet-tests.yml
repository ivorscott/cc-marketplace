name: fleet-tests

on:
  pull_request:

permissions:
  contents: read

# CI is a smoke test: the critical cases (run.sh --smoke) and a parse check of every script. The full suite
# (run.sh with no flag) is for local runs.
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on every script
        run: for f in plugins/developer/skills/fleet/scripts/*.sh plugins/developer/skills/fleet/scripts/test/*.sh plugins/developer/hooks/*.sh; do bash -n "$f" || exit 1; done
      - name: Fleet smoke tests
        run: bash plugins/developer/skills/fleet/scripts/test/run.sh --smoke

  bash32:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: bash -n under /bin/bash (3.2)
        run: for f in plugins/developer/skills/fleet/scripts/*.sh plugins/developer/skills/fleet/scripts/test/*.sh plugins/developer/hooks/*.sh; do /bin/bash -n "$f" || exit 1; done

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: shellcheck changed scripts
        run: |
          files="$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.sh')"
          if [ -z "$files" ]; then
            echo "no changed *.sh files"
            exit 0
          fi
          printf '%s\n' "$files"
          printf '%s\n' "$files" | xargs shellcheck --severity=error
