name: fleet-tests

on:
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the runs of its older heads.
concurrency:
  group: fleet-tests-${{ github.ref }}
  cancel-in-progress: true

# CI runs the whole suite (test/run.sh: one case per behaviour, by area) and a parse check of every script.
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on every script
        run: for f in plugins/developer/skills/fleet/scripts/*.sh plugins/developer/skills/fleet/scripts/test/*.sh plugins/developer/hooks/*.sh; do bash -n "$f" || exit 1; done
      - name: Fleet tests
        run: bash plugins/developer/skills/fleet/scripts/test/run.sh

  bash32:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: bash -n under /bin/bash (3.2)
        run: for f in plugins/developer/skills/fleet/scripts/*.sh plugins/developer/skills/fleet/scripts/test/*.sh plugins/developer/hooks/*.sh; do /bin/bash -n "$f" || exit 1; done

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: shellcheck changed scripts
        run: |
          files="$(git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}...HEAD" -- '*.sh')"
          if [ -z "$files" ]; then
            echo "no changed *.sh files"
            exit 0
          fi
          printf '%s\n' "$files"
          printf '%s\n' "$files" | xargs shellcheck --severity=error
